# 카메라 앵글 바꾸기 기능의 기본 설정입니다.
# 경로는 모두 프로젝트 루트 기준 상대 경로입니다. 같은 이름의 환경 변수(.env)가 있으면 그 값이 우선합니다.
# 모델 가중치는 허깅페이스 캐시(환경 변수 HF_HOME, 기본 ~/.cache/huggingface)에 저장되어 팀원과 같이 씁니다.

[paths]
code_dir = "data/vendor"                  # CAMERA_ANGLE_CODE_DIR: 깊이 모델(MoGe) 추론 코드
output_dir = "outputs/camera_angle"       # CAMERA_ANGLE_OUTPUT_DIR

[photo]
# 원본 사진의 가로 화각(도). 0이면 깊이 모델로 추정합니다.
fov_deg = 0
output_long_side = 1024                   # 결과 이미지의 긴 변 픽셀
max_fov_deg = 150                         # 일반 렌즈 프리셋이 넘지 않을 화각

[rotate]
# 회전 프리셋: 원본 사진을 새 방향으로 다시 찍은 뒤, 원본이 찍지 않은 빈 곳만 생성합니다
empty_color = "#00ff00"                   # 빈 곳 표시색 (생성 모델에 채울 곳을 알려 줌)
fill_prompt = "Extend this photo into the green areas. Continue the existing background exactly as it is, with the same colors, lighting and style, so the result looks like one wider photo. Do not add a new scenery, sky or ground that is not already in the photo. {scene}"
color_match_ratio = 0.08                  # 생성 부분 색을 원본에 맞출 때 쓰는 범위 (결과 가로 대비)
feather_px = 6                            # 원본과 생성 영역의 경계를 부드럽게 섞는 폭

[orbit]
# 3D 이동 프리셋용 설정
hole_color = "#949494"                    # 카메라 이동으로 드러난 빈 곳의 색 (원본 예제와 같음)
prompt = "Change the camera angle from <image2> to <image1>."
lora_strength = 1.0
subject_crop = 0.33                       # 피사체 중심을 찾을 때 쓰는 화면 가운데 비율
point_size_px = 2                         # 점 하나가 덮는 정사각형 크기 (1이면 그물 모양 틈이 생김)
depth_edge_tolerance = 0.04               # 주변 깊이 차이가 깊이의 이 비율을 넘는 경계 점은 버림
# 카메라가 움직여 앞 물체 뒤에서 드러난 틈은 앞 물체 모양이라, 비워 두면 생성 모델이 물체를 한 번 더 그립니다.
# 그런 좁은 틈은 생성 전에 뒤쪽 배경 색으로 미리 메웁니다.
gap_fill_ratio = 0.06                     # 메울 틈의 최대 반폭 (결과 가로 대비). 0이면 메우지 않음
background_depth_share = 0.9              # 주변에서 가장 먼 깊이의 이 비율보다 먼 점만 배경으로 봄

[generation]
seed = 0
steps = 25

[speed]
# 결과가 같은 최적화: 글자와 참고 이미지 부분을 첫 단계에서 계산해 두고 다음 단계부터 재사용
reuse_condition_cache = true
# MagCache: 변화가 작은 단계는 계산을 건너뛰고 앞 단계의 변화량을 재사용 (결과가 아주 조금 달라짐)
# 크기 비율은 mag_cache_ratios.json (모델·LoRA별로 잰 값, speed_up_generation.py 설명 참고)
mag_cache = true
mag_cache_threshold = 0.06                # 누적 오차가 이 값 이하면 건너뜀. 클수록 빠르고 품질은 떨어짐
mag_cache_max_skip_steps = 3              # 연속으로 건너뛸 수 있는 최대 단계 수
mag_cache_retention_ratio = 0.2           # 앞쪽 이 비율의 단계는 그림 구도가 잡히는 때라 건너뛰지 않음

[depth]
model = "moge2"                           # moge2 | moge3 (moge3은 flex-gemm 설치에 CUDA 컴파일러가 필요합니다)
resolution_level = 9
refine_steps = 3
