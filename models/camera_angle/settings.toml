# 카메라 앵글 바꾸기 기능의 기본 설정입니다.
# 경로는 모두 프로젝트 루트 기준 상대 경로입니다. 같은 이름의 환경 변수(.env)가 있으면 그 값이 우선합니다.
# 모델 가중치는 허깅페이스 캐시(환경 변수 HF_HOME, 기본 ~/.cache/huggingface)에 저장되어 팀원과 같이 씁니다.

[paths]
code_dir = "data/vendor"                  # CAMERA_ANGLE_CODE_DIR: 깊이 모델(MoGe) 추론 코드
output_dir = "outputs/camera_angle"       # CAMERA_ANGLE_OUTPUT_DIR
cache_dir = "data/camera_angle_cache"     # CAMERA_ANGLE_CACHE_DIR

[photo]
# 원본 사진의 가로 화각(도). 0이면 깊이 모델로 추정합니다.
fov_deg = 0
output_long_side = 1024                   # 결과 이미지의 긴 변 픽셀
max_fov_deg = 150                         # 일반 렌즈 프리셋이 넘지 않을 화각

[view_360]
# 회전 프리셋용 360도 배경
width = 2048                              # 높이는 width / 2
empty_color = "#00ff00"                   # 빈 곳 표시색 (360도 확장 LoRA가 이 색을 채울 곳으로 학습함)
fill_prompt = "Fill the green areas to complete a seamless 360° equirectangular panorama. {scene} Match both edges."
fill_lora_strength = 0.8
keep_original_feather_px = 6              # 원본 픽셀을 덮을 때 경계를 부드럽게 섞는 폭
# 360도 배경의 왼쪽 끝과 오른쪽 끝이 만나는 이음매 보정 (반 바퀴 돌려 가운데 띠만 다시 그림)
seam_band_px = 512                        # 다시 그릴 띠의 폭 (좁으면 좌우 밝기 차이가 이어지지 않음)
seam_blur_px = 192                        # 띠 경계를 부드럽게 섞는 폭
seam_prompt = "Repair the vertical seam in the center of this 360° equirectangular panorama so the left and right sides continue seamlessly. Keep everything else unchanged."

[orbit]
# 3D 이동 프리셋용 설정
hole_color = "#949494"                    # 카메라 이동으로 드러난 빈 곳의 색 (원본 예제와 같음)
prompt = "Change the camera angle from <image2> to <image1>."
lora_strength = 1.0
subject_crop = 0.33                       # 피사체 중심을 찾을 때 쓰는 화면 가운데 비율
point_size_px = 2                         # 점 하나가 덮는 정사각형 크기 (1이면 그물 모양 틈이 생김)
depth_edge_tolerance = 0.04               # 주변 깊이 차이가 깊이의 이 비율을 넘는 경계 점은 버림

[generation]
seed = 0
steps = 25

[depth]
model = "moge2"                           # moge2 | moge3 (moge3은 flex-gemm 설치에 CUDA 컴파일러가 필요합니다)
resolution_level = 9
refine_steps = 3
