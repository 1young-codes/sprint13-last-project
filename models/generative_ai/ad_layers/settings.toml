# 레이어 광고 만들기 설정입니다. 경로는 프로젝트 루트 기준입니다.

[paths]
output_dir = "outputs/ad_layers"
font_dir = "data/fonts"                   # 폰트를 처음 쓸 때 여기로 내려받습니다

[canvas]
width = 1024
height = 1024
background_color = "#808080"              # 배경 생성에 넘기는 빈 캔버스 색

[product]
max_share = 0.55                          # 제품이 캔버스 가로·세로에서 차지할 최대 비율
center_x = 0.5                            # 제품 가운데의 가로 위치 (캔버스 대비)
bottom_y = 0.85                           # 제품 바닥의 세로 위치 (캔버스 대비)
mask_threshold = 0.5                      # 이보다 진한 마스크를 제품으로 봅니다

[text_layout]
font_limits = { title = 0.10, subtitle = 0.036, price = 0.05 }

# 캔버스 대비 [왼쪽, 위, 가로, 세로]. 제품 위 빈 공간에 배치합니다.
[[template]]
role = "title"
box = [0.08, 0.05, 0.84, 0.11]
[[template]]
role = "subtitle"
box = [0.12, 0.17, 0.76, 0.04]
[[template]]
role = "price"
box = [0.30, 0.22, 0.40, 0.06]

[generation]
seed = 0
steps = 25
background_prompt = "Turn this blank canvas into a photograph of an empty setting. {view} Setting: {scene} Keep the center and the full upper third clear. The continuous surface must extend through the center without a seam. No foreground object, food, product, lettering, logo or watermark. Any decor stays at the far edges."
overhead_view = "Photograph the flat tabletop from directly above. Only the horizontal surface is visible."
angled_view = "Show a continuous surface below and behind the foreground, with empty space above. Keep the surface unobstructed at the horizontal center, about 85 percent down the frame."

# 분위기 3종. idea는 사장님 한 줄이 없을 때 쓰는 기본 장면, style은 장면 설명과 문구에 참고할 분위기, fonts는 역할별 고정 폰트입니다.
[moods.minimal]
label = "미니멀 스튜디오"
idea = "단색 배경의 깔끔한 스튜디오, 부드러운 조명"
style = "clean minimal studio advertisement, modern sans-serif type, lots of empty space"
fonts = { title = "noto_sans_kr_black", subtitle = "noto_sans_kr", price = "noto_sans_kr_black", cta = "noto_sans_kr" }

[moods.lifestyle]
label = "생활 연출"
idea = "제품을 실제로 쓰는 자연스러운 생활 공간"
style = "warm lifestyle magazine advertisement, elegant serif headline"
fonts = { title = "noto_serif_kr", subtitle = "noto_sans_kr", price = "noto_sans_kr_black", cta = "noto_sans_kr" }

[moods.sale]
label = "계절·행사 세일"
idea = "계절 행사 분위기의 밝고 활기찬 세일 장면"
style = "bold seasonal sale advertisement, big heavy headline, eye-catching price"
fonts = { title = "black_han_sans", subtitle = "noto_sans_kr", price = "black_han_sans", cta = "noto_sans_kr_black" }

# 고정 폰트. 모두 SIL 오픈 폰트 라이선스라 상업 광고에 쓸 수 있습니다.
[fonts.noto_sans_kr]
url = "https://github.com/google/fonts/raw/main/ofl/notosanskr/NotoSansKR%5Bwght%5D.ttf"
file = "NotoSansKR.ttf"
weight = 500

[fonts.noto_sans_kr_black]
url = "https://github.com/google/fonts/raw/main/ofl/notosanskr/NotoSansKR%5Bwght%5D.ttf"
file = "NotoSansKR.ttf"
weight = 900

[fonts.noto_serif_kr]
url = "https://github.com/google/fonts/raw/main/ofl/notoserifkr/NotoSerifKR%5Bwght%5D.ttf"
file = "NotoSerifKR.ttf"
weight = 700

[fonts.black_han_sans]
url = "https://github.com/google/fonts/raw/main/ofl/blackhansans/BlackHanSans-Regular.ttf"
file = "BlackHanSans-Regular.ttf"
weight = 400
