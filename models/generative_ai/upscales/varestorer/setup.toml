# VARestorer (ICLR 2026): 시각 자기회귀 모델 Infinity-2B를 한 단계로 증류한 복원 모델.
# 코드·가중치 MIT. 텍스트 인코더(flan-t5-xl, 약 11GB)와 SwinIR 전처리를 함께 씁니다.
# 기본 실행 스크립트(scripts/infer.sh)는 프롬프트가 "코기 강아지" 문장으로 고정되어 있어, 내용을 끌고 가지 않게 빈 프롬프트를 씁니다.
# --tiled 0이면 512로 한 번 생성한 뒤 키우기만 하므로 반드시 타일로 돌립니다. 한 번에 사진 한 장만 받습니다.

[environment]
python = "3.11"
extra_installs = [
  ["--no-build-isolation", "git+https://github.com/cloneofsimo/lora.git@d84074b3e3496f1cfa8a3f49b8b9972ef463b483"],
  ["--no-build-isolation", "flash_attn==2.8.3"],
]

[code]
repo = "EternalEvan/VARestorer"
revision = "d500fad9291df4b9e96720d70b903aff47c42149"

[weights.varestorer]
repo = "EvanEternal/VARestorer"
revision = "44853a055fc9591a6fdde87fadecd2eea861fd67"
files = ["weights/varestorer.pth"]

[weights.infinity_vae]
repo = "FoundationVision/Infinity"
revision = "e7108923249fb3c836ebfbc3f4b4d318d6131293"
files = ["infinity_vae_d32reg.pth"]

[weights.t5]
repo = "google/flan-t5-xl"
revision = "7d6315df2c2fb742f0f5b556879d730926ca9001"
files = ["*.json", "*.safetensors", "spiece.model"]

[weights.swinir]
repo = "lxq007/DiffBIR"
revision = "072829acc62ad378afa55e6005c634788c83ee6c"
files = ["general_swinir_v1.ckpt"]

[links]
"weights/varestorer.pth" = "varestorer:weights/varestorer.pth"
"weights/infinity_vae_d32reg.pth" = "infinity_vae:infinity_vae_d32reg.pth"
"weights/flan-t5-xl" = "t5:"
"weights/general_swinir_v1.ckpt" = "swinir:general_swinir_v1.ckpt"

[run]
scales = [2, 4]
# 값은 저장소 scripts/infer.sh와 같고, 프롬프트와 타일만 바꿨습니다.
command = [
  "tools/run_varestorer.py",
  "--cfg", "1", "--tau", "1", "--pn", "0.25M",
  "--model_path", "weights/varestorer.pth", "--model_type", "infinity_2b",
  "--vae_type", "32", "--vae_path", "weights/infinity_vae_d32reg.pth",
  "--add_lvl_embeding_only_first_block", "1", "--use_bit_label", "1",
  "--rope2d_each_sa_layer", "1", "--rope2d_normalized_by_hw", "2",
  "--use_scale_schedule_embedding", "0", "--checkpoint_type", "torch",
  "--text_encoder_ckpt", "weights/flan-t5-xl", "--text_channels", "2048",
  "--apply_spatial_patchify", "0", "--prompt", "", "--seed", "1",
  "--lq_img_path", "{input_file}", "--save_file", "{output_dir}/{input_stem}.png",
  "--sr_scale", "{scale}", "--tiled", "1", "--tile_size", "512", "--tile_overlap", "128",
]
