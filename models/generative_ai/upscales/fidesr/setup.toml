# FiDeSR (CVPR 2026): SD2.1 위에 LoRA를 붙인 한 단계 확산 업스케일. 원본 충실도와 디테일의 균형을 노린 모델입니다.
# 코드·가중치 Apache-2.0, SD2.1은 openrail++.
# 저장소가 torch 2.0.1과 xformers 0.0.20에 고정되어 있어 파이썬 3.10 전용 가상환경을 씁니다.
# README는 RAM 태깅 모델을 받으라고 하지만, 추론 코드는 빈 프롬프트를 써서 RAM이 필요 없습니다.

[environment]
python = "3.10"

[code]
repo = "Ar0Kim/FiDeSR"
revision = "8042f139fc3f6f91ac450c41f69a14c45f16ac4b"

[weights.sd21]
repo = "Manojb/stable-diffusion-2-1-base"      # FiDeSR README가 가리키는 SD2.1-base 사본
revision = "0094d483a120f3f33dafbd187ea4aa60d10de75c"
files = [
  "model_index.json", "scheduler/*", "tokenizer/*", "feature_extractor/*",
  "text_encoder/config.json", "text_encoder/model.safetensors",
  "unet/config.json", "unet/diffusion_pytorch_model.safetensors",
  "vae/config.json", "vae/diffusion_pytorch_model.safetensors",
]

[weights.fidesr]
repo = "jmjin2/FiDeSR"
revision = "ce89d9f22a81c97be53440628a4237ff0afb0851"
files = ["fidesr.pkl"]

[links]
"preset/models/stable-diffusion-2-1-base" = "sd21:"
"preset/models/fidesr.pkl" = "fidesr:fidesr.pkl"

[run]
scales = [2, 4]
command = [
  "test_fidesr.py",
  "--pretrained_model_path", "preset/models/stable-diffusion-2-1-base",
  "--pretrained_path", "preset/models/fidesr.pkl",
  "-i", "{input_dir}", "-o", "{output_dir}", "--upscale", "{scale}",
  "--process_size", "512", "--hf_scale", "0.2", "--lf_scale", "0.2",
]
